# .github/workflows/snake.yml
#
# Generates the contribution-graph snake animation and pushes it
# to the "output" branch, where the README references it.
#
# Setup:
#   1. Put this file at .github/workflows/snake.yml in the alpgi1/alpgi1 repo
#   2. Settings → Actions → General → Workflow permissions
#      → select "Read and write permissions" → Save
#   3. Actions tab → "Generate Snake" → Run workflow (first run is manual)

name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"      # daily at 03:00 UTC
  workflow_dispatch:          # manual trigger
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
